## avahi - the reflector here is what actually moves mDNS across your zone
## boundaries. Every Allow-mDNS-* firewall rule depends on it. umdns is a
## responder, not a reflector, and is not installed on this build.
[server]
host-name=XiaoQiang
domain-name=intra
use-ipv4=yes
use-ipv6=yes
check-response-ttl=no
use-iff-running=no
## PRIVATE excluded per your call: mDNS is reflected across IOT, SVC and GUEST
## only. NOTE the consequence — the Allow-mDNS-PRIVATE-to-IOT firewall rules
## become inert, because avahi is the thing that would carry those packets
## across. A phone on PRIVATE will no longer discover the Hue bridge or the
## air-Q. If that is not what you want, drop br-private from this list.
## allow-interfaces is the safer form: deny-interfaces is a blocklist, so a new
## bridge or tunnel is reflected by default until you remember to add it.
## This is an allowlist — anything not named here is not touched.
##
## br-private is included: without it your phone and laptop cannot discover the
## Hue bridge, Roborock, air-Q or the Daikins, and the Allow-mDNS-PRIVATE-to-IOT
## firewall rules would match nothing.
##
## wan and the wg tunnels are absent, which is the part that matters — mDNS must
## never leave the premises. Being an allowlist, a tunnel you add later is
## excluded by default rather than needing to be remembered.
allow-interfaces=br-iot,br-svc,br-guest,br-private

[publish]
publish-addresses=yes
publish-hinfo=no
publish-workstation=no
publish-domain=yes
publish-dns-servers=192.168.137.2

[reflector]
enable-reflector=yes
reflect-ipv=yes

[rlimits]
rlimit-core=0
rlimit-data=4194304
rlimit-fsize=0
rlimit-nofile=30
rlimit-stack=4194304
rlimit-nproc=3
