# /etc/chrony.conf
# UCI-generated directives are loaded from the confdir below; this file is for
# things the UCI wrapper does not expose.

confdir /var/etc/chrony.d
sourcedir /var/run/chrony-dhcp

# Require agreement from at least two sources before the clock is adjusted.
# This is the defence against ONE source being blocked, hijacked or simply
# wrong: a single dissenting or silenced server cannot move your clock.
minsources 2

# Never accept an offset larger than a day without manual intervention. Guards
# against a pathological source or a replayed response driving the clock into
# a state where TLS everywhere starts failing.
maxchange 86400 5 0

# Log clock errors above 0.5 seconds
logchange 0.5

# No per-client logging: nothing to amplify, nothing to leak.
noclientlog

# Mark the system clock as synchronized
rtcsync

# Coasting matters here. With a drift file, a well-disciplined clock holds
# sub-second accuracy for days without any upstream at all — which is why a
# blocking attack is an availability problem, not a correctness one.
driftfile /var/run/chrony/drift

# NTS keys and cookies
ntsdumpdir /var/run/chrony
