# Port of the surviving half of /etc/firewall.d/firewall.nat6 (trevorj's
# openwrt-masq6). fw4 implements `option masq6` natively, so the masquerading
# half of that script is dead code — but `masq6_privacy` was never a real fw4
# option. It only ever did what these two sysctls do, per device.
#
# accept_ra=2 is required: with forwarding enabled the kernel ignores RAs
# unless explicitly told not to, and temporary addresses need the RA's prefix.
net.ipv6.conf.wan.accept_ra = 2
net.ipv6.conf.wan.use_tempaddr = 2
