# LuCI's Kernel Log tab reads /dev/kmsg. If uhttpd runs unprivileged it cannot,
# and the page renders empty with no error — which is what you saw.
#
# This is the low-impact fix. The alternative was CAP_SYSLOG in uhttpd's
# capability set, but anything that must survive uhttpd's setuid has to be
# AMBIENT, and ambient capabilities are inherited by every CGI it spawns. A
# readable ring buffer is a much smaller grant than a capability that follows
# execve.
#
# Set to 1 if you would rather the ring buffer stay root-only and lose the tab.
# CAP_NET_RAW for LuCI's ping/traceroute is deliberately NOT granted: it would
# have to be ambient too, and a CGI that can forge raw packets is a different
# class of thing entirely. Use the shell for diagnostics.
kernel.dmesg_restrict = 0
