# Gaps found by reading `sysctl -a` off the running box rather than the files.
# Everything here was verifiably wrong at runtime, not theoretically wrong.

# ---------------------------------------------------------------------------
# ICMP redirects — the one that was actually live
# ---------------------------------------------------------------------------
# `sysctl -a` showed net.ipv4.conf.wan.send_redirects = 1 while
# net.ipv4.conf.all.send_redirects = 0. That is not a contradiction: this
# sysctl uses OR semantics (IN_DEV_ORCONF), so `all` cannot override a
# per-interface 1 — it can only add. Every interface had inherited 1 from
# conf.default, so the router was emitting ICMP redirects on wan.
#
# Setting `default` is what actually fixes it, because that is what new
# interfaces inherit. `all` is kept for the sysctls that use AND semantics.
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# accept_redirects and accept_source_route had all=0 but default=1. Those two
# use AND semantics so the effective value was already 0 — but any interface
# created later inherits `default`, and relying on one half of a pair being
# right is how the send_redirects case happened.
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.default.accept_source_route = 0

# IPv6 had accept_redirects = 1 on BOTH all and default, inconsistent with the
# v4 side. Forwarding routers ignore redirects, so this is belt and braces —
# but there is no reason for the two families to disagree.
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# ---------------------------------------------------------------------------
# Kernel address exposure
# ---------------------------------------------------------------------------
# kptr_restrict was 0: kernel pointers printed verbatim in /proc and dmesg,
# which hands an attacker KASLR defeat for free. 1 masks them for unprivileged
# readers. Not 2, which also masks them for root and makes your own crash
# analysis harder — and you have already needed to read an ath10k register
# dump once.
kernel.kptr_restrict = 1

# ---------------------------------------------------------------------------
# Consistency
# ---------------------------------------------------------------------------
# somaxconn is 4096 but tcp_max_syn_backlog was 128, so the SYN queue was the
# real ceiling and the larger accept queue was decorative. Nothing here serves
# enough connections for it to matter, but the two should agree.
net.ipv4.tcp_max_syn_backlog = 1024

# ---------------------------------------------------------------------------
# NOT changed, and why
# ---------------------------------------------------------------------------
# rp_filter = 0 everywhere: loose mode (2) would be marginally safer, but with
#   pbr sending replies out interfaces the FIB would not choose, strict-ish
#   checks and policy routing are a known bad pair. 0 is the right call here.
# swappiness = 60: correct for zram, where a swap-out is a compression rather
#   than a disk write. Lowering it would push reclaim onto the page cache.
# tcp_congestion_control = cubic: BBR is not built, and the router originates
#   almost no bulk TCP. Not worth a kernel config change.
# conntrack_max = 32768 with 26112 buckets: an unusually high bucket ratio,
#   which trades memory for short hash chains. Fine on this box.
