# Applied at boot by /etc/init.d/sysfsutils (START=11). Paths are relative to
# /sys — the mount point is prepended automatically.
#
# WHY THIS AND NOT rc.local OR A uci-defaults SCRIPT
#   uci-defaults runs once and is then deleted; sysfs resets on every boot, so
#   the setting would survive exactly one. rc.local runs late, after the
#   network is already up and has spent the boot at the default governor.
#   sysfsutils is declarative, runs early, and reads /etc/sysfs.d/*.conf — so
#   this is a config file rather than a script, and it is one line to revert.
#
# WHY IT IS SAFE AT START=11
#   ARM_QCOM_CPUFREQ_NVMEM=y in the target config, so the driver is built in
#   and the policy exists before userspace starts. A missing attribute is
#   logged and skipped rather than fatal, so this cannot block boot.
#
# WHAT IT DOES
#   Pins the A53s to their maximum operating point instead of letting
#   schedutil scale. The workload this is for is WireGuard: packet-rate-bound
#   softirq work where the cost is the ramp on the first packets of a burst,
#   not the steady state. It has no effect on the NSS cores, which run on
#   their own clocks and are not managed by cpufreq at all.
#
# WHAT YOU ACTUALLY GET depends on the silicon bin, not on this file. The OPP
# table offers 1017/1382 MHz to every bin (opp-supported-hw = 0xf) and
# 1651/1843/1920/2208 MHz only to bin 0 (0x1), read from the SoC fuses by
# cpufreq-qcom-nvmem. Confirm with:
#   cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_available_frequencies
#   cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_cur_freq
#
# All four cores share one clock domain on IPQ8074, so cpu0 governs the lot.
# The other three are listed because they cost nothing and make the intent
# explicit if a future kernel ever splits the policy.
devices/system/cpu/cpu0/cpufreq/scaling_governor = performance
devices/system/cpu/cpu1/cpufreq/scaling_governor = performance
devices/system/cpu/cpu2/cpufreq/scaling_governor = performance
devices/system/cpu/cpu3/cpufreq/scaling_governor = performance
