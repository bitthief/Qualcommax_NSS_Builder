## Ported from your 6.1 sysupgrade.conf. /etc/config is always preserved and
## is not listed. Entries that referenced things this build no longer has have
## been dropped rather than left dangling:
##   /etc/init.d/miniupnpd      miniupnpd pruned
##   /etc/mwan3.user            mwan3 -> pbr
##   /etc/firewall.user         fw4 never read it
##   /etc/firewall.d/*          fw3-era, dead under fw4
##   /etc/hotplug.d/online/6*,7*  ipset-dns -> dnsmasq nftset
##   /etc/openvpn/              no openvpn interfaces
##   /etc/dropbear/             build is openssh
##   /etc/sysctl.d/qca-nss-drv.conf   package-shipped, regenerated
##   /etc/sysctl.d/99-xiaoqiang.conf  renamed to 21-tcp-tuning.conf

# sysupgrade
/etc/sysupgrade.conf

# startup customizations
/etc/rc.local

# Avahi (the cross-zone mDNS reflector)
/etc/avahi/avahi-daemon.conf

# sysctl tuning
/etc/sysctl.d/

# sysfs attributes applied at boot (cpufreq governor)
/etc/sysfs.conf
/etc/sysfs.d/

# ssh: host keys, authorized_keys, and the port/bind config
/etc/ssh/

# chrony: NTS keys and cookies survive, so time bootstrap is not re-run
/etc/chrony.conf

# VPN
/etc/wireguard/
/etc/wg-failover/
/etc/proxychains.conf

# nftables includes (DNS hijack, WAN hardening, DoH sets, NTP hijack)
/etc/nftables.d/

# DoH blocklist and the generator that turns it into dnsmasq nftset= lines
/etc/doh-domains.txt
/etc/dnsmasq.d/

# hotplug
/etc/hotplug.d/

# cron: wg-failover and port-forward schedules
/etc/crontabs/

# shell customizations
/etc/profile
/etc/profile.d/
