## Populate fw4's @doh / @doh6 sets directly from DNS answers.
## Replaces ipset-dns + /etc/hotplug.d/online/60-ipset-doh +
## /etc/hotplug.d/online/70-ipset-setup + /etc/firewall.d/ipset-doh.
##
## Requires dnsmasq-full with nftset support (CONFIG_PACKAGE_dnsmasq_full_nftset=y,
## which you already had enabled).
##
## Syntax: nftset=/<domain>/<family>#<table-family>#<table>#<set>
## fw4's table is `inet fw4`, so both sets live there.
##
## Domain list is generated from /etc/doh-domains.txt by
## /etc/uci-defaults/97-doh-nftset.sh at first boot - edit that file, not this
## one, and re-run the generator to pick up additions.

