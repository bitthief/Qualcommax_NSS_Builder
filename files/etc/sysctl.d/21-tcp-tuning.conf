## Was 99-xiaoqiang.conf - a name inherited from the Xiaomi stock firmware.
## Renamed to say what it is, and trimmed of the values that NSS overrides.
##
## DROPPED vs the old file:
##   net.core.netdev_max_backlog  - nss.sysctl sets 4096 from a measurement
##                                  (softnet_stat drops at line-rate bursts).
##                                  It loads after this and would win anyway.
##   rmem/wmem defaults           - stock-firmware era values, superseded.

net.ipv4.tcp_congestion_control=bbr

net.ipv4.tcp_mem = 65536 262144 8388608
net.ipv4.tcp_rmem = 65536 262144 8388608
net.ipv4.tcp_wmem = 65536 262144 8388608
net.ipv4.tcp_max_syn_backlog = 4096
net.core.somaxconn = 8192
net.core.optmem_max = 81920
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 3
net.ipv4.tcp_window_scaling = 1
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_max_tw_buckets = 262144
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_low_latency = 1
net.ipv4.tcp_mtu_probing = 1
net.ipv4.ip_local_port_range = 1025 65000

## Loose reverse-path filtering (2), NOT strict (1).
## Strict validates the return path against the main routing table, which pbr
## deliberately diverges from. With policy routing into three tunnels, strict
## drops legitimate return traffic on asymmetric paths - and the symptom is
## specific flows failing for no visible reason, which is miserable to
## attribute when you have just changed the kernel too. Loose keeps the
## anti-spoofing that matters.
net.ipv4.conf.default.rp_filter = 2
net.ipv4.conf.all.rp_filter = 2
